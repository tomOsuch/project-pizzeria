<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Pizzeria</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:400,300i,700%7COswald:300,500,700&amp;subset=latin-ext"
    rel="stylesheet">
  <link href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="vendor/range-slider.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="header__wrapper">
        <div class="logo">
          <h1 class="logo__title"><span>Mamma</span>Mia!</h1>
          <h2 class="logo__subtitle">the best homemade Italian food</h2>
        </div>
        <div class="main-nav">
          <a href="#home">Home</a>
          <a href="#order">Order</a>
          <a href="#booking">Booking</a>
        </div>
        <div id="cart" class="cart">
          <div class="cart__summary">
            <span class="cart__total-number">0</span>
            <span class="cart__total-price">Total price: $<strong>0</strong></span>
            <i class="fas fa-chevron-down"></i>
            <i class="fas fa-shopping-cart cart__icon"></i>
          </div>
          <div class="cart__content">
            <form class="cart__order">
              <ul class="cart__order-summary no-spacing">
              </ul>
              <ul class="cart__order-price">
                <li class="cart__order-subtotal">
                  <span class="cart__order-price-name">Subtotal:</span>
                  <span class="cart__order-price-sum">$<strong>0</strong></span>
                </li>
                <li class="cart__order-delivery">
                  <span class="cart__order-price-name">Delivery:</span>
                  <span class="cart__order-price-sum">$<strong>0</strong></span>
                </li>
                <li class="cart__order-total">
                  <span class="cart__order-price-name"><strong>Total:</strong></span>
                  <span class="cart__order-price-sum">$<strong>0</strong></span>
                </li>
              </ul>
              <div class="cart__order-confirmation">
                <input type="tel" name="phone" placeholder="Your phone">
                <input type="text" name="address" placeholder="Your address">
                <button type="submit" class="btn-secondary">Order</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div id="pages">
    <section id="home">
      <div class="home-wrapper container"></div>
    </section>
    <section id="order">
      <div id="product-list" class="product-list container"></div>
    </section>
    <section id="booking">
      <div class="booking-wrapper container"></div>
    </section>
  </div>

  <script id="template-booking-widget" type="text/x-handlebars-template">
      <div class='booking-widget'>
        <h2 class='page__title no-spacing'>Book a table</h2>
        <form class='booking-form'>
          <div class='time-picker'>
            <div class='date-picker'>
              <label class='booking-option-title'>Pick a date</label>
              <input type='text' name='date' />
            </div>
            <div class='hour-picker range-slider'>
              <div class='output'></div>
              <label class='booking-option-title'>Pick a time</label>
              <input type='range' name='hour' value='12' min='12' max='24' step='0.5' />
            </div>
          </div>
          <div class='floor-plan'>
            <div class='object entry'>entry</div>
            <div class='object bar'>bar</div>
            <div class='object table' data-table='1'>table-1</div>
            <div class='object table table--round' data-table='2'>table-2</div>
            <div class='object table' data-table='3'>table-3</div>
          </div>
          <p class='booking-table-message' aria-live='polite'></p>
          <div class='booking-options'>
            <!-- options -->
            <label class='booking-option-title'>
              <!-- option-row -->
              People
              <div class='widget-amount people-amount'>
                <!-- widget-amount -->
                <a class='btn-quantity' href='#less'><i class='fas fa-minus'></i></a>
                <input class='amount' type='text' name='people' value='1' />
                <a class='btn-quantity' href='#more'><i class='fas fa-plus'></i></a>
              </div>
            </label>
            <label class='booking-option-title'>
              <!-- option-row -->
              Hours
              <div class='widget-amount hours-amount'>
                <!-- widget-amount -->
                <a class='btn-quantity' href='#less'><i class='fas fa-minus'></i></a>
                <input class='amount' type='text' name='hours' value='1' />
                <a class='btn-quantity' href='#more'><i class='fas fa-plus'></i></a>
              </div>
            </label>
            <div>
              <!-- option-row -->
              <span class='booking-option-title'>Starters</span>
              <div class='checkbox'>
                <!-- checkbox -->
                <label>
                  <input type='checkbox' name='starter' value='water' />
                  <span class='checkbox__checkmark'></span>
                  Water
                </label>
              </div>
              <div class='checkbox'>
                <!-- checkbox -->
                <label>
                  <input type='checkbox' name='starter' value='bread' />
                  <span class='checkbox__checkmark'></span>
                  Bread
                </label>
              </div>
            </div>
          </div>
          <div class='order-confirmation'>
            <input type='tel' name='phone' placeholder='Your phone' />
            <input type='text' name='address' placeholder='Your address' />
            <button type='submit' class='btn-secondary'>Book table</button>
          </div>
        </form>
      </div>
    </script>

  <script id="template-home-widget" type="text/x-handlebars-template">
      <div class="home-cta">
        <a href="#/order" class="home-cta__tile">
          <span class="home-cta__media home-cta__media--order" aria-hidden="true"></span>
          <span class="home-cta__label">Order online</span>
        </a>
        <a href="#/booking" class="home-cta__tile">
          <span class="home-cta__media home-cta__media--book" aria-hidden="true"></span>
          <span class="home-cta__label">Book a table</span>
        </a>
        <div class="home-hours-banner">
          <p class="home-hours-banner__title">Opening hours:</p>
          <p class="home-hours-banner__when">TUE-SUN, 12PM - 12AM</p>
        </div>
      </div>

      <div class="home-testimonial" data-home-testimonial>
        <div class="home-testimonial__viewport">
          <div class="home-testimonial__track">
            <article class="home-testimonial__slide">
              <div class="home-testimonial__photo">
                <img src="images/home/pizza-4.jpg" alt="">
              </div>
              <div class="home-testimonial__content">
                <h3 class="home-testimonial__heading">Amazing service!</h3>
                <p class="home-testimonial__text">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aliquam eget aliquam sapien, eget pulvinar massa. Mauris accumsan, dolor nec vulputate feugiat, ex lorem convallis metus, id facilisis lacus arcu sed ante.</p>
                <p class="home-testimonial__author">- Margaret Osborne</p>
              </div>
            </article>
            <article class="home-testimonial__slide">
              <div class="home-testimonial__photo">
                <img src="images/home/pizza-5.jpg" alt="">
              </div>
              <div class="home-testimonial__content">
                <h3 class="home-testimonial__heading">Best pizza in town!</h3>
                <p class="home-testimonial__text">Suspendisse potenti. Cras in purus eu magna vulputate luctus. Cras mattis consectetur purus sit amet fermentum. Aenean lacinia bibendum nulla sed consectetur.</p>
                <p class="home-testimonial__author">- James Sullivan</p>
              </div>
            </article>
            <article class="home-testimonial__slide">
              <div class="home-testimonial__photo">
                <img src="images/home/pizza-6.jpg" alt="">
              </div>
              <div class="home-testimonial__content">
                <h3 class="home-testimonial__heading">We will be back!</h3>
                <p class="home-testimonial__text">Nulla vitae elit libero, a pharetra augue. Maecenas faucibus mollis interdum. Donec id elit non mi porta gravida at eget metus.</p>
                <p class="home-testimonial__author">- Anna Williams</p>
              </div>
            </article>
          </div>
        </div>
        <div class="home-testimonial__dots" role="group" aria-label="Testimonials">
          <button type="button" class="home-testimonial__dot active" data-index="0" aria-label="Slide 1" aria-current="true"></button>
          <button type="button" class="home-testimonial__dot" data-index="1" aria-label="Slide 2"></button>
          <button type="button" class="home-testimonial__dot" data-index="2" aria-label="Slide 3"></button>
        </div>
      </div>

      <div class="home-gallery">
        <div class="home-gallery__grid">
          <a href="https://www.instagram.com/" class="home-gallery__item" target="_blank" rel="noopener noreferrer" aria-label="Open this photo on Instagram">
            <img src="images/home/pizza-1.jpg" alt="Restaurant dish">
            <span class="home-gallery__overlay" aria-hidden="true">
              <span class="home-gallery__icon"><i class="fas fa-heart"></i></span>
              <span class="home-gallery__icon"><i class="fas fa-share-alt"></i></span>
            </span>
          </a>
          <a href="https://www.instagram.com/" class="home-gallery__item" target="_blank" rel="noopener noreferrer" aria-label="Open this photo on Instagram">
            <img src="images/home/pizza-2.jpg" alt="Fresh ingredients">
            <span class="home-gallery__overlay" aria-hidden="true">
              <span class="home-gallery__icon"><i class="fas fa-heart"></i></span>
              <span class="home-gallery__icon"><i class="fas fa-share-alt"></i></span>
            </span>
          </a>
          <a href="https://www.instagram.com/" class="home-gallery__item" target="_blank" rel="noopener noreferrer" aria-label="Open this photo on Instagram">
            <img src="images/home/pizza-3.jpg" alt="Pizza">
            <span class="home-gallery__overlay" aria-hidden="true">
              <span class="home-gallery__icon"><i class="fas fa-heart"></i></span>
              <span class="home-gallery__icon"><i class="fas fa-share-alt"></i></span>
            </span>
          </a>
          <a href="https://www.instagram.com/" class="home-gallery__item" target="_blank" rel="noopener noreferrer" aria-label="Open this photo on Instagram">
            <img src="images/home/pizza-7.jpg" alt="Restaurant">
            <span class="home-gallery__overlay" aria-hidden="true">
              <span class="home-gallery__icon"><i class="fas fa-heart"></i></span>
              <span class="home-gallery__icon"><i class="fas fa-share-alt"></i></span>
            </span>
          </a>
          <a href="https://www.instagram.com/" class="home-gallery__item" target="_blank" rel="noopener noreferrer" aria-label="Open this photo on Instagram">
            <img src="images/home/pizza-8.jpg" alt="Pizza preparation">
            <span class="home-gallery__overlay" aria-hidden="true">
              <span class="home-gallery__icon"><i class="fas fa-heart"></i></span>
              <span class="home-gallery__icon"><i class="fas fa-share-alt"></i></span>
            </span>
          </a>
          <a href="https://www.instagram.com/" class="home-gallery__item" target="_blank" rel="noopener noreferrer" aria-label="Open this photo on Instagram">
            <img src="images/home/pizza-9.jpg" alt="Restaurant window">
            <span class="home-gallery__overlay" aria-hidden="true">
              <span class="home-gallery__icon"><i class="fas fa-heart"></i></span>
              <span class="home-gallery__icon"><i class="fas fa-share-alt"></i></span>
            </span>
          </a>
        </div>
        <a href="https://www.instagram.com/" class="home-gallery__more" target="_blank" rel="noopener noreferrer">View more on Instagram</a>
      </div>
    </script>

  <script id="template-cart-product" type="text/x-handlebars-template">
    <li>
      <div class="widget-amount"> <!-- widget-amount -->
        <a class="btn-quantity btn-quantity--lt" href="#less"><i class="fas fa-minus"></i></a>
        <input class="amount" type="text" value="{{ amount }}">
        <a class="btn-quantity btn-quantity--lt" href="#more"><i class="fas fa-plus"></i></a>
      </div>
      <div class="cart__product">
        <div class="cart__product-header">
          <span>{{ name }}</span>
          <span>$<strong class="cart__product-price">{{ price }}</strong></span>
        </div>
        <ul class="cart__product-details no-spacing">
          {{#each params}}
            <li>
              <span class="cart__product-details-label">{{ label }}</span>
              <span>{{#joinValues options}}, {{/joinValues}}</span>
            </li>
          {{/each}}
        </ul>
      </div>
      <ul class="cart__action-buttons no-spacing">
        <li><a href="#edit">Edit<i class="fas fa-pencil-alt"></i></a></li>
        <li><a href="#remove">Remove<i class="fas fa-trash-alt"></i></a></li>
      </ul>
    </li>
  </script>

  <script id="template-menu-product" type="text/x-handlebars-template">
      <article class="product"> <!-- product -->

          <header class="product__header">
            <h3 class="product__name no-spacing">{{ name }} <i class="fas fa-chevron-down product__icon"></i></h3>
            <p class="product__base-price no-spacing">${{ price }}</p>
          </header>
          <div class="product__description"> <!-- description -->
            <p>{{{ description }}}</p>
          </div> <!-- .description -->
          <div class="product__wrapper"> <!-- details -->
            <form class="product__order">
              <ul class="product__params"> <!-- params -->
                {{#each params as |param paramId| }}
                {{#ifEquals type "checkboxes"}}
                <li> <!-- checkboxes -->
                  <h3 class="product__params-title">{{{ label }}}</h3>
                  {{#each options}}
                  <div class="checkbox"> <!-- checkbox -->
                    <label>
                      <input type="checkbox" name="{{ paramId }}" value="{{ @key }}" id="{{ @key }}" {{#if default}}checked{{/if}}>
                      <span class="checkbox__checkmark"></span>
                      {{{ label }}} (${{{ price }}})
                    </label>
                  </div>
                  {{/each}}
                </li>
                {{/ifEquals}}
                {{#ifEquals type "radios"}}
                <li> <!-- radios -->
                  <h3 class="product__params-title">{{{ label }}}</h3>
                  {{#each options}}
                  <div class="checkbox checkbox--round"> <!-- radio -->
                    <label>
                      {{{ label }}} (${{{ price }}})
                      <input type="radio" name="{{ paramId }}" value="{{ @key }}" id="{{ @key }}" {{#if default}}checked{{/if}}>
                      <span class="checkbox__checkmark"></span>
                    </label>
                  </div>
                  {{/each}}
                </li>
                {{/ifEquals}}
                {{#ifEquals type "select"}}
                <li> <!-- select -->
                  <h3 class="product__params-title">{{{ label }}}</h3>
                  <select name="{{ paramId }}">
                    {{#each options}}
                    <option value="{{ @key }}" {{#if default}}selected{{/if}}>{{{ label }}} (${{{ price }}})</option>
                    {{/each}}
                  </select>
                </li>
                {{/ifEquals}}
                {{/each}}
              </ul>
              <div class="amount"> <!-- controls -->
                <div class="widget-amount"> <!-- widget-amount -->
                  <h3 class="product__params-title">Select quantity</h3>
                  <a class="btn-quantity" href="#less"><i class="fas fa-minus"></i></a>
                  <input type="text" class="amount">
                  <a class="btn-quantity" href="#more"><i class="fas fa-plus"></i></a>
                </div>
                <p class="product__total-price">
                  Total: $<span class="price">{{{ price }}}</span>
                </p>
                <div> <!-- add-to-cart -->
                  <a class="btn-primary" href="#add-to-cart">Add to cart</a>
                </div>
              </div>
            </form>
            <div class="product__images {{ class }}"> <!-- images -->
              {{#each images}}
              {{{ this }}}
              {{/each}}
            </div>
          </div>

      </article> <!-- .product -->
    </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.1.0/handlebars.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="vendor/range-slider.min.js"></script>
  <script src="js/app.js" type="module"></script>
</body>

</html>
